<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c2129; --line:#272e38;
  --text:#e6edf3; --muted:#9aa7b4; --dim:#7d8998;
  --accent:#58a6ff; --accent-soft:rgba(88,166,255,.12);
  --good:#3fb950;
  --radius:14px;
  --maxw:1080px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f8fa; --panel:#ffffff; --panel-2:#f2f5f8; --line:#dde3ea;
    --text:#111820; --muted:#55616e; --dim:#6b7681;
    --accent:#0969da; --accent-soft:rgba(9,105,218,.09);
    --good:#1a7f37;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  line-height:1.65; font-size:16px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px 72px}
.skip{
  position:absolute; left:-9999px; top:0; background:var(--panel); color:var(--text);
  padding:10px 16px; border:1px solid var(--line); border-radius:0 0 8px 0; z-index:10;
}
.skip:focus{left:0}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,.chip:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}

/* ── header ─────────────────────────────────────────── */
header{padding:64px 0 40px; text-align:center}
.avatar{
  width:132px; height:132px; border-radius:50%; object-fit:cover;
  border:3px solid var(--line); margin-bottom:20px;
}
h1{margin:0 0 6px; font-size:clamp(30px,5vw,44px); letter-spacing:-.02em; font-weight:700}
.tagline{margin:0 0 18px; color:var(--muted); font-size:clamp(15px,2.2vw,19px); font-weight:500}
.badge{
  display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
  background:var(--accent-soft); border:1px solid var(--line);
  color:var(--muted); border-radius:999px;
  padding:7px 16px; font-size:12.5px; letter-spacing:.01em;
}
.badge strong{color:var(--text); font-weight:650}
.badge .pulse{
  width:7px; height:7px; border-radius:50%; background:var(--good);
  box-shadow:0 0 0 0 rgba(63,185,80,.5); animation:pulse 2.6s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}
  70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}
  100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}
}
.hero-line{
  max-width:640px; margin:0 auto 20px; color:var(--muted);
  font-size:clamp(14.5px,1.9vw,16.5px); line-height:1.6;
}
.refreshed{color:var(--dim)}

/* ── sections ───────────────────────────────────────── */
section{margin-top:52px}
h2{
  font-size:13px; text-transform:uppercase; letter-spacing:.13em;
  color:var(--muted); font-weight:700; margin:0 0 20px;
  padding-bottom:10px; border-bottom:1px solid var(--line);
}
h3{margin:0 0 6px; font-size:16px; font-weight:650; letter-spacing:-.01em}
p{margin:0 0 14px}
.lead{font-size:17.5px; color:var(--text)}

/* ── metric tiles ───────────────────────────────────── */
.metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.metric{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 18px; text-align:left;
}
.metric-v{
  font-size:clamp(24px,3.4vw,33px); font-weight:700; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums; line-height:1.15; color:var(--text);
}
.metric-l{font-size:13.5px; color:var(--muted); margin-top:6px; line-height:1.4}
.metric-src{
  margin-top:12px; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--dim); display:inline-flex; align-items:center; gap:5px;
}
.metric-src::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--dim)}
.metric-src--live::before{background:var(--good)}
.metric-src--product::before{background:var(--accent)}

/* ── capability matrix ──────────────────────────────── */
.caps{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
.cap{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px}
.cap-name{color:var(--text)}
.cap-proves{color:var(--muted); font-size:14px; margin:0 0 14px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:999px;
  padding:5px 12px; font-size:12.5px; color:var(--text);
}
a.chip:hover{border-color:var(--accent); text-decoration:none}
.chip--private{color:var(--muted); border-style:dashed}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none}
.tag-private{
  font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--dim); border:1px dashed var(--line); border-radius:999px; padding:1px 7px;
}

/* ── project cards ──────────────────────────────────── */
.cards{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; position:relative;
}
.card--flagship{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card-t a{color:var(--text)}
.card-t a:hover{color:var(--accent)}
.card-d{color:var(--muted); font-size:14px; margin:6px 0 14px}
.card-m{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--dim)}
.sep{opacity:.5}

/* ── language bar ───────────────────────────────────── */
.langbar{display:flex; height:12px; border-radius:999px; overflow:hidden; border:1px solid var(--line)}
.seg{display:block; height:100%}
.langkey{
  list-style:none; padding:0; margin:16px 0 0;
  display:flex; flex-wrap:wrap; gap:8px 22px; font-size:13px; color:var(--muted);
}
.langkey li{display:flex; align-items:center; gap:7px}
.pct{color:var(--dim); font-variant-numeric:tabular-nums}

/* ── lists ──────────────────────────────────────────── */
.stack{list-style:none; padding:0; margin:0; display:grid; gap:12px}
.stack li{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; font-size:15px;
}
.stack .who{color:var(--text); font-weight:650}
.stack .what{color:var(--muted)}
.impact{list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.impact li{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; font-size:14.5px; color:var(--muted);
}
.impact b{
  display:block; color:var(--text); font-size:20px; font-weight:700;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-bottom:3px;
}
.tags{display:flex; flex-wrap:wrap; gap:8px; padding:0; margin:0; list-style:none}
.tags li{
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:7px 14px; font-size:13.5px; color:var(--muted);
}
.plain{padding-left:20px; margin:0; color:var(--muted)}
.plain li{margin-bottom:8px}
.plain strong{color:var(--text)}

/* ── research ───────────────────────────────────────── */
.figure{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px; text-align:center; margin-top:18px;
}
.figure img{max-width:min(520px,100%); height:auto; border-radius:8px}
.figure figcaption{color:var(--dim); font-size:12.5px; margin-top:12px}

/* ── weekly activity ───────────────────────────────── */
.activity{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 22px;
}
.act-line{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:10px;
  margin:0 0 8px; font-size:15px; color:var(--muted);
}
.act-line b{
  color:var(--text); font-size:24px; font-weight:700;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-right:4px;
}
.act-note{margin:0; font-size:12.5px; color:var(--dim); line-height:1.55}

/* ── citation chart ─────────────────────────────────── */
.citebox{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px; margin-top:18px;
}
.citestats{
  display:flex; flex-wrap:wrap; gap:10px 30px; margin-bottom:18px;
  font-size:13.5px; color:var(--muted);
}
.citestats b{
  color:var(--text); font-size:22px; font-weight:700; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; margin-right:6px;
}
.chart{width:100%; height:auto; display:block; overflow:visible}
.cbar{fill:var(--accent); opacity:.85; transition:opacity .15s}
.cbar:hover{opacity:1}
.cgrid{stroke:var(--line); stroke-width:1}
.cax{fill:var(--dim); font-size:10.5px; font-family:inherit}
.citenote{color:var(--dim); font-size:12.5px; margin:16px 0 0; line-height:1.55}

/* ── footer ─────────────────────────────────────────── */
footer{
  margin-top:64px; padding-top:24px; border-top:1px solid var(--line);
  text-align:center; color:var(--dim); font-size:12.5px;
}

/* ── responsive ─────────────────────────────────────── */
@media (max-width:820px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .caps,.cards,.impact{grid-template-columns:1fr}
}
@media (max-width:460px){
  .metrics{grid-template-columns:1fr}
  header{padding:44px 0 28px}
}

/* ── motion / print ─────────────────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
@media print{
  :root{--bg:#fff;--panel:#fff;--panel-2:#fff;--line:#ccc;--text:#000;--muted:#333;--dim:#555;--accent:#000}
  body{font-size:11pt}
  .badge .pulse,.avatar{display:none}
  .metric,.cap,.card,.stack li,.impact li,.figure{break-inside:avoid}
  a[href^="http"]::after{content:" (" attr(href) ")"; font-size:8pt; color:#555}
  section{margin-top:22px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Page not found</h1>
  <p class="hero-line">That page does not exist. It may have moved, or the link may be wrong.</p>
  <p><a href="/">Return to the homepage</a></p>
</header>
</div>
</body>
</html>
